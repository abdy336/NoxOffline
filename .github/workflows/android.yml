name: NoxPlayer APK Build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sistem Paketlerini Yukle
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip3 install --user --upgrade pip
          pip3 install --user buildozer kivy Cython==0.29.33

      - name: APK Uret
        run: |
          export PATH=$PATH:$HOME/.local/bin
          yes | buildozer android debug
          
      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: NoxPlayer-Android-APK
          path: bin/*.apk
          
